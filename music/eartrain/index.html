<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta http-equiv="x-ua-compatible" content="ie=edge" />
  <meta name="description" content="Ear Trainer" />
  <meta name="keywords" content="ear training" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  
  <title>Ear Trainer</title>

  <link rel='stylesheet prefetch' href='https://fonts.googleapis.com/css?family=Source+Sans+Pro:400,300,900,700,600,200' />
  <link rel="stylesheet" type="text/css" href="./js/abcjs-audio.css" />
  <link rel="stylesheet" href="css/style.css" />

  <script src='https://cdnjs.cloudflare.com/ajax/libs/jquery/2.2.2/jquery.min.js'></script>
  <script src="./js/abcjs-basic-min.js" type="text/javascript"></script>
  <script src="https://code.jquery.com/jquery-3.4.1.js"></script>

</head>

<body onload="load()">

<div class="wrapper typo">

  <div id="outer">
    <div id="inner">
      <main>
        
        <div id="buttons">
          <button type="button" class="button play">Play     </button>
          <button type="button" class="button show_hint">Show Hint</button>
          <button type="button" class="button enable_prep">Enable Preparation Beats</button>
          <button type="button" class="button enable_beats">Enable Flashing Beats</button>
          <button type="button" class="button enable_cursor">Enable Cursor</button>
          <button type="button" class="button show_answer">Show Answer</button>
          <button type="button" class="button enable_melody">Enable Melody</button>
          <button type="button" class="button next_question" style="background-color: #adadad;">Next Exercise</button>
        </div>

        <div id="exercise">Exercise with 3/4 rhythm and 3 bars</div>

        <div id="paperhint"></div>
        <div id="paper"></div>
        <div id="audio" style="display: none;"></div>
        
        
      </main>
    </div>
  </div>
</div>

<script src="js/songs.js"         type="text/javascript"></script>
<script src="js/synth.js"         type="text/javascript"></script>
<script src="js/load.js"          type="text/javascript"></script>

</body>
</html>
